name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -v --junitxml=backend-test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend-test-results.xml

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t campuspass-backend:ci .
      - name: Build frontend image
        run: docker build -t campuspass-frontend:ci ./frontend

  # Only fires on a direct push to main (not on PRs), and only once the
  # tests and both image builds above have succeeded. Requires two repo
  # secrets - RENDER_DEPLOY_HOOK_BACKEND and RENDER_DEPLOY_HOOK_FRONTEND -
  # each a deploy hook URL from that Render service's Settings page. If a
  # secret is missing, that service deploy trigger is skipped with a warning
  # so CI still passes while making the missing config visible in logs.
  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy (backend)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"
      - name: Skip backend deploy trigger when hook is not configured
        if: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND == '' }}
        run: echo "::warning::RENDER_DEPLOY_HOOK_BACKEND is not set; skipping backend deploy trigger."
      - name: Trigger Render deploy (frontend)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"
      - name: Skip frontend deploy trigger when hook is not configured
        if: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND == '' }}
        run: echo "::warning::RENDER_DEPLOY_HOOK_FRONTEND is not set; skipping frontend deploy trigger."
