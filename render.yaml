databases:
  - name: campuspass-db
    databaseName: campuspass
    plan: free

services:
  - type: web
    name: campuspass-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campuspass-db
          property: connectionString
      # Guards scripts/seed.py's --demo flag - Render should only ever
      # seed the real accounts, never the password123 demo ones.
      - key: ENVIRONMENT
        value: production
      # Read by the SEED_ON_STARTUP bootstrap (see app/main.py) to set each
      # real account's initial password - Render's free tier has no shell,
      # so there's no way to run `python -m scripts.seed` by hand. generateValue
      # gives each a strong random value automatically; override before first
      # deploy if you want to choose your own instead.
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_TEACHER_PASSWORD
        generateValue: true
      - key: SEED_STUDENT_PASSWORD
        generateValue: true
      - key: SEED_SECURITY_PASSWORD
        generateValue: true
      # One-time bootstrap flag (see app/main.py) - "true" for exactly one
      # deploy to create the real accounts (their passwords then appear in
      # this service's deploy logs - that's the only place to read them on a
      # shell-less platform), then flip back to "false" so it doesn't keep
      # re-running (a no-op once the accounts exist, but a wasteful one) on
      # every subsequent restart.
      - key: SEED_ON_STARTUP
        value: "false"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: campuspass-frontend
          property: host
        # Same fromService caveat as BACKEND_HOST_SUFFIX below: this
        # resolves to just the frontend's internal slug, with neither a
        # scheme nor the .onrender.com suffix. Not on the critical path -
        # the frontend never calls the backend cross-origin (nginx proxies
        # /api/* server-side), so CORS only matters for direct API access
        # (e.g. Swagger UI, a future API client) - but if you need it
        # correct, edit it in the Render dashboard to
        # "https://<frontend-service>.onrender.com" after first deploy.

  - type: web
    name: campuspass-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: campuspass-backend
          property: host
      - key: BACKEND_SCHEME
        value: https
      # Render's fromService `host` property resolves to just the service's
      # internal slug (e.g. "campuspass-backend-mzx8"), not a publicly
      # resolvable hostname - this completes it into the real public FQDN
      # the frontend's nginx actually needs to reach over the internet
      # (the free tier has no private networking). See nginx.conf.template.
      - key: BACKEND_HOST_SUFFIX
        value: .onrender.com
