databases:
  - name: campuspass-db
    databaseName: campuspass
    plan: free

services:
  - type: web
    name: campuspass-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campuspass-db
          property: connectionString
      # Guards scripts/seed.py's --demo flag - Render should only ever
      # seed the real accounts, never the password123 demo ones.
      - key: ENVIRONMENT
        value: production
      # Read by `python -m scripts.seed` (run once by hand via the Render
      # shell after first deploy - see instructions.md) to set each real
      # account's initial password. generateValue gives each a strong
      # random value automatically; view them in the Render dashboard's
      # environment tab, or override before first seeding.
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_TEACHER_PASSWORD
        generateValue: true
      - key: SEED_STUDENT_PASSWORD
        generateValue: true
      - key: SEED_SECURITY_PASSWORD
        generateValue: true
      # One-time bootstrap flag (see app/main.py) - set to "true" for a
      # single deploy to create the real accounts on a platform with no
      # shell access, then flip back to "false" so it doesn't reseed (a
      # no-op, but a wasteful one) on every restart.
      - key: SEED_ON_STARTUP
        value: "true"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: campuspass-frontend
          property: host
        # Render's `fromService` hostname has no scheme prefix; this value
        # needs a one-time manual edit after first deploy to
        # "https://<that-hostname>" in the Render dashboard. It's not on the
        # critical path either way - the frontend never calls the backend
        # cross-origin (nginx proxies /api/* server-side), so CORS only
        # matters for direct API access (e.g. Swagger UI, a future API
        # client), not the app itself.

  - type: web
    name: campuspass-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: campuspass-backend
          property: host
      - key: BACKEND_SCHEME
        value: https
      # Render's fromService `host` property resolves to just the service's
      # internal slug (e.g. "campuspass-backend-mzx8"), not a publicly
      # resolvable hostname - this completes it into the real public FQDN
      # the frontend's nginx actually needs to reach over the internet
      # (the free tier has no private networking). See nginx.conf.template.
      - key: BACKEND_HOST_SUFFIX
        value: .onrender.com
