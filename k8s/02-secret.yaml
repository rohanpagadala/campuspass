# DEV/DEMO PLACEHOLDER ONLY. Do not use these values anywhere real.
#
# For an actual deployment, don't edit this file - generate the secret
# imperatively instead, so real values never touch git history:
#
#   kubectl create secret generic campuspass-secret \
#     --namespace campuspass \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=SEED_ADMIN_PASSWORD="$(openssl rand -base64 18)" \
#     --from-literal=SEED_TEACHER_PASSWORD="$(openssl rand -base64 18)" \
#     --from-literal=SEED_STUDENT_PASSWORD="$(openssl rand -base64 18)" \
#     --from-literal=SEED_SECURITY_PASSWORD="$(openssl rand -base64 18)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The SEED_* values are read by `python -m scripts.seed` (run once, by hand,
# after deploying - see docs) to set each real account's initial password.
# Only the real accounts are ever seeded in a cluster - the --demo flag is
# local-only and refuses to run when ENVIRONMENT=production (set in
# 01-configmap.yaml / the backend Deployment).
#
# stringData (vs. data) takes plain text and lets Kubernetes do the
# base64 encoding - there's no "is this already encoded?" ambiguity.
apiVersion: v1
kind: Secret
metadata:
  name: campuspass-secret
  namespace: campuspass
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_ME_dev-placeholder-not-a-real-secret"
  SEED_ADMIN_PASSWORD: "REPLACE_ME_placeholder"
  SEED_TEACHER_PASSWORD: "REPLACE_ME_placeholder"
  SEED_STUDENT_PASSWORD: "REPLACE_ME_placeholder"
  SEED_SECURITY_PASSWORD: "REPLACE_ME_placeholder"
