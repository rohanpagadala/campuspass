# DEV/DEMO PLACEHOLDER ONLY. Do not use this value anywhere real.
#
# For an actual deployment, don't edit this file - generate the secret
# imperatively instead, so a real key never touches git history:
#
#   kubectl create secret generic campuspass-secret \
#     --namespace campuspass \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# stringData (vs. data) takes plain text and lets Kubernetes do the
# base64 encoding - there's no "is this already encoded?" ambiguity.
apiVersion: v1
kind: Secret
metadata:
  name: campuspass-secret
  namespace: campuspass
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_ME_dev-placeholder-not-a-real-secret"
