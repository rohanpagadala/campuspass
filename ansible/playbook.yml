---
- name: Deploy CampusPass (Docker + Kubernetes via Minikube) on a fresh Ubuntu host
  hosts: campuspass_servers
  become: true
  vars:
    repo_url: "https://github.com/YOUR_USERNAME/campuspass.git"
    repo_dest: "/opt/campuspass"
    kubectl_version: "v1.30.0"
    minikube_version: "v1.33.1"

  roles:
    - docker
    - kubernetes_tools
    - campuspass_deploy
